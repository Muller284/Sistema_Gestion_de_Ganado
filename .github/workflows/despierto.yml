# ============================================================================
#  Mantiene despierto el servidor publicado en Render (DECISIONES.md, punto 52)
# ============================================================================
#
#  El plan gratuito de Render duerme el servidor a los 15 minutos sin uso, y
#  la primera visita después espera cerca de un minuto. Esto le pide la lista
#  de países cada 10 minutos, solo de 8:00 a 20:00 de Bolivia (12:00 a 23:59
#  UTC): unas 370 horas al mes, dentro de las 750 gratuitas de Render. De
#  noche se deja dormir.
#
#  GitHub corre los horarios solo desde la rama principal, y a veces con
#  algunos minutos de retraso. La dirección sale de la variable URL_API del
#  repositorio (Settings → Secrets and variables → Actions → Variables); si no
#  está, usa la de render.yaml.
# ============================================================================

name: Servidor despierto

on:
  schedule:
    - cron: '*/10 12-23 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pedir la lista de países
        env:
          URL_API: ${{ vars.URL_API || 'https://ganado-univalle-api.onrender.com' }}
        run: curl --fail --silent --show-error --max-time 120 --retry 2 "$URL_API/paises" -o /dev/null
