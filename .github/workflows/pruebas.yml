name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pruebas-servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./servidor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: servidor/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas
        run: npm test

  pruebas-cliente:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cliente
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cliente/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas
        run: npm test
