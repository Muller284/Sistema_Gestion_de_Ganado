# El cliente compilado. Las rutas van con # (HashRouter), así que alcanza con
# servir index.html; el try_files queda por si se pasa a BrowserRouter.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan un hash en el nombre: se guardan un año.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
